name: release

# A v*.*.* tag on main starts a release. main only receives release merges from develop, so the
# tagged commit is always the one to release.
on:
  push:
    tags:
      - "v*.*.*"

# GoReleaser needs to create the GitHub release and upload its assets.
permissions:
  contents: write

jobs:
  # The CI workflow runs on branch pushes, not on tags. This job checks the exact tagged commit
  # before anything is released.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: go test
        run: go test -race -cover ./...
      - name: install screen
        run: sudo apt-get update && sudo apt-get install -y screen && screen -v
      - name: integration tests
        run: go test -race -tags integration -count=1 ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the full history for the changelog.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
