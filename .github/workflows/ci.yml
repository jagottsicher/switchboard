name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -cover ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: install screen
        run: sudo apt-get update && sudo apt-get install -y screen && screen -v
      - name: integration tests
        run: go test -race -tags integration -count=1 ./...
